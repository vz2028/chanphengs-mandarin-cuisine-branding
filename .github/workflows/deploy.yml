name: Deploy to Namecheap

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Sync to public_html via FTP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:    ${{ secrets.FTP_SERVER }}
          username:  ${{ secrets.FTP_USERNAME }}
          password:  ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/
          # Exclude planning docs, archived originals, repo metadata, README, etc.
          # so only deploy-ready files land on the server.
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.planning/**
            **/_archive/**
            **/node_modules/**
            **/.venv/**
            **/venv/**
            **/__pycache__/**
            **/.DS_Store
            **/Thumbs.db
            **/*.dc.html
            **/.image-slots.state.json
            **/.thumbnail
            **/README.md
            **/.gitignore
            **/images/**
            **/uploads/**
